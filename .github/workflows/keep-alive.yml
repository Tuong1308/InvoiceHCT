name: Supabase Keep-Alive

on:
  schedule:
    # Runs daily at 00:00 UTC to prevent Supabase Free tier from pausing after 7 days
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase REST API..."
          curl -s -f -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1" > /dev/null
          echo "Supabase ping successful."

